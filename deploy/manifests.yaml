---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clb-controller
  namespace: kube-system
---
# RBAC ขั้นต่ำจริงๆ
# เทียบกับ cloud-controller-manager ตัวเต็มที่ต้องการ nodes/status update,
# patch nodes และ delete nodes — controller นี้อ่าน node อย่างเดียว
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clb-controller
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clb-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clb-controller
subjects:
  - kind: ServiceAccount
    name: clb-controller
    namespace: kube-system
---
# leader election ใช้ Lease ใน namespace เดียว ไม่ต้องให้สิทธิ์ทั้งคลัสเตอร์
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clb-controller-leader-election
  namespace: kube-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clb-controller-leader-election
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clb-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: clb-controller
    namespace: kube-system
---
# Secret ถูกตั้งใจไม่ให้อยู่ในไฟล์นี้
#
# ถ้าใส่ Secret ที่มีค่า placeholder ไว้ตรงนี้ การ `kubectl apply -f manifests.yaml`
# ครั้งถัดไปจะเขียนทับคีย์จริงด้วย placeholder เงียบๆ แล้ว controller จะ auth ไม่ผ่าน
# โดยที่ไม่มีอะไรบอกว่าเกิดอะไรขึ้น
#
# สร้างแยกครั้งเดียวด้วย (read -rs กันคีย์ติด shell history):
#
#   read -rs -p "secret-id: "  SID; echo
#   read -rs -p "secret-key: " SKEY; echo
#   kubectl -n kube-system create secret generic tencentcloud-credentials \
#     --from-literal=secret-id="$SID" --from-literal=secret-key="$SKEY"
#   unset SID SKEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clb-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: clb-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clb-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clb-controller
    spec:
      serviceAccountName: clb-controller
      priorityClassName: system-cluster-critical
      # controller ต้องรันได้แม้ node worker ยังไม่พร้อม
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: clb-controller
      containers:
        - name: controller
          image: ghcr.io/drsaluml/k3s-tencent-clb-controller:latest
          args:
            # ต้องไม่ซ้ำกับคลัสเตอร์อื่นใน account เดียวกัน ไม่งั้นสองคลัสเตอร์
            # จะมองเห็น CLB ของกันและกันจาก tag แล้วแย่งกัน reconcile
            - --cluster-id=CHANGE-ME
            # ต้องตรงกับภูมิภาคที่ node อยู่จริง ผิดแล้วจะสร้าง CLB คนละภูมิภาค
            # กับ node แล้วหา CVM ไม่เจอ ขึ้น NodesNotResolvable ทุก node
            - --region=CHANGE-ME
            - --vpc-id=vpc-CHANGEME
            # - --default-subnet-id=subnet-xxxx   # จำเป็นถ้าจะใช้ internal LB
            - --leader-elect=true
            - --concurrent-service-syncs=2
            - --resync-period=10m
            - --cloud-api-qps=10
          env:
            - name: TENCENTCLOUD_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: tencentcloud-credentials
                  key: secret-id
            - name: TENCENTCLOUD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tencentcloud-credentials
                  key: secret-key
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
