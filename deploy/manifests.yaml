---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clb-controller
  namespace: kube-system
---
# RBAC ขั้นต่ำจริงๆ
# เทียบกับ cloud-controller-manager ตัวเต็มที่ต้องการ nodes/status update,
# patch nodes และ delete nodes — controller นี้อ่าน node อย่างเดียว
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clb-controller
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clb-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clb-controller
subjects:
  - kind: ServiceAccount
    name: clb-controller
    namespace: kube-system
---
# leader election ใช้ Lease ใน namespace เดียว ไม่ต้องให้สิทธิ์ทั้งคลัสเตอร์
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clb-controller-leader-election
  namespace: kube-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clb-controller-leader-election
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clb-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: clb-controller
    namespace: kube-system
---
# ConfigMap และ Secret ถูกตั้งใจไม่ให้อยู่ในไฟล์นี้
#
# ถ้าใส่ค่า placeholder ไว้ตรงนี้ การ `kubectl apply -f manifests.yaml` ครั้งถัดไป
# จะเขียนทับค่าจริงด้วย placeholder เงียบๆ แล้ว controller จะ auth ไม่ผ่าน
# หรือแย่กว่านั้นคือไปสร้าง CLB ผิดภูมิภาค โดยไม่มีอะไรบอกว่าเกิดอะไรขึ้น
#
# key ต้องเป็นชื่อ env var ที่ถูกต้อง เพราะ Deployment ใช้ envFrom —
# key ที่มีขีดกลางจะถูก kubelet ข้ามทิ้งพร้อม warning event
#
#   kubectl -n kube-system create configmap clb-controller-config \
#     --from-literal=CLUSTER_ID=th1 \
#     --from-literal=TENCENTCLOUD_REGION=ap-bangkok \
#     --from-literal=VPC_ID=vpc-xxxxxxxx
#
#   kubectl -n kube-system create secret generic tencentcloud-credentials \
#     --from-literal=TENCENTCLOUD_SECRET_ID="$SID" \
#     --from-literal=TENCENTCLOUD_SECRET_KEY="$SKEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clb-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: clb-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: clb-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clb-controller
    spec:
      serviceAccountName: clb-controller
      priorityClassName: system-cluster-critical
      # controller ต้องรันได้แม้ node worker ยังไม่พร้อม
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: clb-controller
      containers:
        - name: controller
          # pin เป็นเวอร์ชันเสมอ อย่าใช้ :latest — controller ตัวนี้มีสิทธิ์สร้างและลบ CLB
          # การ restart แล้วได้โค้ดคนละเวอร์ชันโดยไม่รู้ตัวคือความเสี่ยงที่ไม่คุ้ม
          # และ rollback ก็ทำไม่ได้ถ้าไม่รู้ว่าเดิมรันอะไรอยู่
          image: ghcr.io/drsaluml/k3s-tencent-clb-controller:v0.2.0
          # ไฟล์นี้ไม่มีค่าที่ต้องแก้ก่อน apply เลย — ค่าที่ต่างกันในแต่ละคลัสเตอร์
          # อยู่ใน ConfigMap/Secret ที่สร้างแยก ทำให้ apply ซ้ำได้ตลอดโดยไม่ทับของเดิม
          args:
            - --leader-elect=true
            - --concurrent-service-syncs=2
            - --resync-period=10m
            - --cloud-api-qps=10
          envFrom:
            # CLUSTER_ID / TENCENTCLOUD_REGION / VPC_ID / DEFAULT_SUBNET_ID
            # ถ้า ConfigMap ไม่มี pod จะไม่ start เลย — ตั้งใจให้พังดังๆ
            # ดีกว่ารันด้วยค่า placeholder แล้วไปสร้าง CLB ผิดที่
            - configMapRef:
                name: clb-controller-config
            - secretRef:
                name: tencentcloud-credentials
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
