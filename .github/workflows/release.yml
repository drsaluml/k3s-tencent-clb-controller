name: Release

on:
  push:
    tags:
      - "v*"
  # ปุ่มกดเองใน Actions tab เผื่ออยากได้ image จาก main โดยไม่ต้อง tag
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ได้เป็น drsaluml/k3s-tencent-clb-controller โดยอัตโนมัติ
  # ไม่ hardcode ชื่อ owner ไว้ เผื่อมีการ fork
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ไม่ปล่อย image ที่ test ไม่ผ่านออกไป
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # จำเป็นสำหรับ push ขึ้น GHCR ด้วย GITHUB_TOKEN — ไม่ต้องสร้าง PAT
      packages: write
      # ให้ cosign/provenance ขอ OIDC token ได้
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # แปลง git ref → docker tag
      #   tag v1.2.3  → :v1.2.3, :1.2, :1, :latest
      #   push main   → :main, :sha-<short>
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=k3s-tencent-clb-controller
            org.opencontainers.image.description=Lightweight Service type=LoadBalancer controller for Tencent Cloud CLB on K3s

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # stamp เวอร์ชันลงใน binary ให้ตรงกับ tag ที่ push
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
