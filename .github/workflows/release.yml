name: Release

on:
  push:
    tags:
      - "v*"
  # ปุ่มกดเองใน Actions tab เผื่ออยากได้ image จาก main โดยไม่ต้อง tag
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ได้เป็น drsaluml/k3s-tencent-clb-controller โดยอัตโนมัติ
  # ไม่ hardcode ชื่อ owner ไว้ เผื่อมีการ fork
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ไม่ปล่อย image ที่ test ไม่ผ่านออกไป
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # write ไม่ใช่ read — ขั้นสุดท้ายสร้าง GitHub Release ซึ่งเขียนลง repo
      # ถ้าเป็น read จะได้ 403 "Resource not accessible by integration"
      # หลัง image ถูก push ขึ้น GHCR สำเร็จไปแล้ว
      contents: write
      # จำเป็นสำหรับ push ขึ้น GHCR ด้วย GITHUB_TOKEN — ไม่ต้องสร้าง PAT
      packages: write
      # ให้ cosign/provenance ขอ OIDC token ได้
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # แปลง git ref → docker tag
      #   tag v1.2.3  → :v1.2.3, :1.2, :1, :latest
      #   push main   → :main, :sha-<short>
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=k3s-tencent-clb-controller
            org.opencontainers.image.description=Lightweight Service type=LoadBalancer controller for Tencent Cloud CLB on K3s

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # stamp เวอร์ชันลงใน binary ให้ตรงกับ tag ที่ push
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ```

  # เก็บ image ไว้ 5 เวอร์ชันล่าสุด ที่เหลือลบทิ้ง
  #
  # ห้ามใช้ actions/delete-package-versions แบบ delete-only-untagged-versions
  # ที่เห็นกันทั่วไป — เรา push multi-arch พร้อม provenance/sbom หนึ่ง tag จึงกลาย
  # เป็นหลาย package version โดยมีแค่ manifest list ที่ถือ tag ส่วน child manifest
  # ของ amd64/arm64 กับ attestation ไม่มี tag การกวาด untagged ทิ้งจะทำให้ :latest
  # ยังอยู่ในหน้า package แต่ pull ไม่ได้ และจะไปโผล่ตอน rollout ไม่ใช่ตอนรัน workflow
  # action ตัวนี้ไล่จาก manifest list ลงไปหา child แล้วเว้นตัวที่ยังถูกอ้างอิงอยู่
  cleanup:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    # image ขึ้น GHCR ไปแล้วตั้งแต่ job ก่อนหน้า เก็บกวาดพลาดไม่ควรทำให้ release แดง
    continue-on-error: true
    # action ตัวนี้รันพร้อมกันบน package เดียวกันไม่ได้
    concurrency:
      group: ghcr-cleanup-${{ github.repository }}

    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-tagged: 5
          # latest คือ tag ที่ deploy/manifests.yaml ใช้ ส่วน main มาจาก
          # workflow_dispatch — กันทั้งคู่ไว้ไม่ให้ถูกนับรวมหรือถูกลบ
          exclude-tags: latest,main
          delete-untagged: true
          # multi-arch ที่ child หายไปบางส่วนคือซากที่ pull ไม่ได้อยู่แล้ว
          delete-partial-images: true
          # ตรวจว่า manifest ที่เหลือยังครบ child หลังลบเสร็จ
          validate: true
