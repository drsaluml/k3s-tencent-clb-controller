name: CI

on:
  push:
    branches: [main]
  pull_request:
  # ให้เรียกจาก workflow อื่นได้ — release.yml เรียกอันนี้ก่อนจะ push image
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # อ่านเวอร์ชันจาก go.mod ตรงๆ จะได้ไม่ต้องแก้สองที่เวลา bump
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race จับ data race ใน resolver cache และ fake ที่ reconciler หลายตัวใช้ร่วมกัน
      - name: go test
        run: go test -race -count=1 ./...

  # ตรวจว่า Dockerfile ยัง build ได้ทั้งสองสถาปัตยกรรม แต่ไม่ push
  # เจอปัญหา cross-compile ตั้งแต่ตอน PR ไม่ใช่ตอน tag release
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
